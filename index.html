<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>理論上匹克球｜教練</title>
<style>
  :root {
    --green: #1f5f4a; --green-dark: #16463a; --green-light: #e6f0eb;
    --bg: #f5f8f6; --line: #c9d6d0; --text: #222; --muted: #6b7a74;
    --warn: #b4572e; --warn-bg: #fff4ea; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.55;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header { background: var(--green); color: #fff; padding: 18px 16px 16px; }
  header .kicker { font-size: 12px; letter-spacing: .15em; opacity: .8; }
  header h1 { margin: 2px 0 0; font-size: 22px; }
  header .back { color: #fff; opacity: .85; font-size: 14px; background: none; border: 0; padding: 0; margin-bottom: 4px; font-family: inherit; }
  main { padding: 16px 16px 120px; max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; color: var(--green-dark); margin: 0 0 12px; }
  .banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; font-size: 14px;
    background: var(--green-light); color: var(--green-dark); border-left: 4px solid var(--green); }
  .banner.warn { background: var(--warn-bg); color: #7a3a17; border-left-color: var(--warn); }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  label.title { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  label.title .req { color: var(--warn); margin-left: 2px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  input[type=text], input[type=tel], input[type=email], input[type=date], textarea, select {
    width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--text); font-family: inherit; -webkit-appearance: none; appearance: none;
  }
  textarea { min-height: 72px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--green); outline-offset: -1px; border-color: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); }
  .chips.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: block; text-align: center; padding: 9px 10px; border: 1px solid var(--line); border-radius: 999px;
    font-size: 14px; background: #fff; cursor: pointer; user-select: none; }
  .chip input:checked + span { background: var(--green); border-color: var(--green); color: #fff; }
  .chip input:focus-visible + span { outline: 2px solid var(--green-dark); outline-offset: 2px; }
  .error-text { color: var(--warn); font-size: 13px; margin-top: 6px; display: none; }
  .invalid .error-text { display: block; }
  .invalid input, .invalid textarea { border-color: var(--warn); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.96); border-top: 1px solid var(--line); }
  .bar-inner { max-width: 560px; margin: 0 auto; }
  button { font-family: inherit; }
  button.primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px; border: 0; border-radius: 12px;
    background: var(--green); color: #fff; }
  button.primary:disabled { opacity: .55; }
  button.ghost { width: 100%; font-size: 15px; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
    background: #fff; color: var(--green-dark); }
  button.link { border: 0; background: none; color: var(--warn); font-size: 14px; padding: 4px 0; }
  .center { text-align: center; padding: 48px 16px; }
  .center .big { font-size: 20px; font-weight: 700; color: var(--green-dark); margin: 12px 0 8px; }
  .center p { color: var(--muted); margin: 0 0 4px; font-size: 15px; }
  .spinner { width: 36px; height: 36px; margin: 0 auto; border: 3px solid var(--green-light); border-top-color: var(--green);
    border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check { width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; background: var(--green); color: #fff; font-size: 30px; line-height: 56px; }
  .hidden { display: none !important; }
  .code { font-size: 12px; color: var(--muted); margin-top: 16px; word-break: break-all; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); margin: 18px 4px 8px; letter-spacing: .05em; }
  .item { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 10px; color: var(--text); font-size: 15px; }
  .item:active { background: var(--green-light); }
  .item .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; color: var(--green-dark); }
  .item .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .item .tag { font-size: 12px; color: var(--warn); font-weight: 600; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 18px 8px; background: #fff;
    border: 1px dashed var(--line); border-radius: var(--radius); }
  .session-head { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
  .session-head .t { font-weight: 700; color: var(--green-dark); font-size: 16px; }
  .session-head .s { font-size: 13px; color: var(--muted); }
  .stu { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; background: #fbfdfc; }
  .stu-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .stu-head b { color: var(--green-dark); }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .row2 > * { min-width: 0; }
  input[type=date] { min-width: 0; max-width: 100%; display: block; min-height: 44px; }
  /* 課堂學員 */
  .prev { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
  .prev .h { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .prev .k { font-weight: 700; color: var(--green-dark); }
  .prev p { margin: 4px 0 0; white-space: pre-wrap; }
  details.sc { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; }
  details.sc > summary { list-style: none; padding: 12px 14px; cursor: pointer; }
  details.sc > summary::-webkit-details-marker { display: none; }
  details.sc[open] > summary { border-bottom: 1px solid var(--green-light); }
  .sc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sc-name { font-weight: 700; color: var(--green-dark); font-size: 16px; }
  .sc-level { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .sc-arrow { color: var(--muted); font-size: 13px; white-space: nowrap; }
  details.sc[open] .sc-arrow { transform: rotate(90deg); display: inline-block; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--green-light); color: var(--green-dark); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
  .pill.grey { background: #eef1ef; color: var(--muted); }
  .sc-body { padding: 10px 14px 14px; font-size: 14px; }
  .sc-att { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .note { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 8px; }
  .note:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .note .m { font-size: 12px; color: var(--muted); }
  .note .l { margin-top: 2px; white-space: pre-wrap; }
  .note .l b { color: var(--green-dark); font-weight: 600; }
  .sc-actions { margin-top: 12px; }
  .sc-actions button { padding: 9px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <button class="back hidden" id="btnBack" type="button">‹ 返回</button>
  <div class="kicker">理論上匹克球｜教練</div>
  <h1 id="pageTitle">教練</h1>
</header>

<!-- 共用：載入中／錯誤 -->
<section id="viewLoading" class="center">
  <div class="spinner"></div>
  <p style="margin-top:14px">載入中…</p>
</section>
<section id="viewError" class="center hidden">
  <div class="big">無法開啟</div>
  <p id="errorMsg">請關閉頁面後再試一次。</p>
  <div class="code" id="errorCode"></div>
  <div style="max-width:320px;margin:20px auto 0"><button class="ghost" onclick="location.reload()">重新載入</button></div>
</section>
<section id="viewDone" class="center hidden">
  <div class="check">✓</div>
  <div class="big" id="doneTitle">已送出</div>
  <p id="doneMsg"></p>
  <div style="max-width:320px;margin:24px auto 0">
    <button class="primary hidden" id="btnDoneNext" type="button"></button>
    <button class="ghost" style="margin-top:10px" onclick="closeLiff()">關閉</button>
  </div>
</section>

<!-- ============ 教練資料 ============ -->
<main id="viewProfile" class="hidden">
  <div id="profileBanner" class="banner"></div>
  <div class="card">
    <h2>基本資料</h2>
    <div class="field" data-field="姓名">
      <label class="title" for="p_name">姓名<span class="req">*</span></label>
      <input type="text" id="p_name" maxlength="30" autocomplete="name">
      <div class="error-text">請填寫姓名</div>
    </div>
    <div class="field" data-field="電話">
      <label class="title" for="p_phone">手機<span class="req">*</span></label>
      <input type="tel" id="p_phone" inputmode="numeric" maxlength="12" placeholder="0912345678" autocomplete="tel">
      <div class="error-text">請填寫正確的電話，例如 0912345678</div>
    </div>
    <div class="field" data-field="Email">
      <label class="title" for="p_email">Email</label>
      <input type="email" id="p_email" maxlength="100" placeholder="name@gmail.com" autocomplete="email">
      <div class="error-text">Email 格式不正確</div>
    </div>
  </div>
  <div class="card">
    <h2>教學資料</h2>
    <div class="field">
      <label class="title" for="p_cert">證照</label>
      <textarea id="p_cert" maxlength="500" placeholder="例：PPR Level 1、USAPA 認證…"></textarea>
    </div>
    <div class="field">
      <label class="title">可教程度</label>
      <div class="chips" id="p_levels"></div>
      <div class="hint">可複選</div>
    </div>
    <div class="field">
      <label class="title" for="p_skill">擅長項目</label>
      <textarea id="p_skill" maxlength="500" placeholder="例：新手入門、雙打戰術、發球"></textarea>
    </div>
    <div class="field">
      <label class="title">可排課時段</label>
      <div class="chips grid3" id="p_slots"></div>
      <div class="hint">可複選</div>
    </div>
  </div>
  <div class="bar"><div class="bar-inner"><button class="primary" id="btnProfile" type="button">送出</button></div></div>
</main>

<!-- ============ 課程日誌：清單 ============ -->
<main id="viewJournalList" class="hidden">
  <div class="section-title">待寫日誌</div>
  <div id="jl_pending"></div>
  <div class="section-title" id="jl_writtenTitle">已寫，可修改</div>
  <div id="jl_written"></div>
</main>

<!-- ============ 課程日誌：表單 ============ -->
<main id="viewJournalForm" class="hidden">
  <div id="jf_banner" class="banner hidden"></div>
  <div class="session-head">
    <div class="t" id="jf_title"></div>
    <div class="s" id="jf_sub"></div>
  </div>
  <div class="card">
    <h2>班級整體紀錄</h2>
    <div class="field" data-field="教學主題">
      <label class="title" for="jf_topic">教學主題<span class="req">*</span></label>
      <input type="text" id="jf_topic" maxlength="100" placeholder="例：反手切球、第三拍落點">
      <div class="error-text">請填寫教學主題</div>
    </div>
    <div class="field" id="jf_methodField">
      <label class="title">訓練方式</label>
      <div class="chips" id="jf_method"></div>
    </div>
    <div class="field">
      <label class="title" for="jf_done">完成內容</label>
      <textarea id="jf_done" maxlength="1000"></textarea>
    </div>
    <div class="field">
      <label class="title" for="jf_overall">班級整體狀況</label>
      <textarea id="jf_overall" maxlength="1000"></textarea>
    </div>
    <div class="field">
      <label class="title" for="jf_next">下堂課建議</label>
      <textarea id="jf_next" maxlength="1000"></textarea>
    </div>
    <div class="field">
      <label class="title" for="jf_handover">交接注意事項</label>
      <textarea id="jf_handover" maxlength="1000" placeholder="下一位教練需要注意什麼"></textarea>
    </div>
    <div class="field">
      <label class="title" for="jf_special">特殊狀況</label>
      <textarea id="jf_special" maxlength="1000" placeholder="受傷、場地問題等（沒有可留白）"></textarea>
    </div>
  </div>
  <div class="card">
    <h2>需要特別注意的學員</h2>
    <div class="hint" style="margin:-6px 0 12px">只需要填有狀況的學員，不用每個人都寫。</div>
    <div id="jf_students"></div>
    <div class="row2">
      <select id="jf_pick" aria-label="選擇學員"></select>
      <button class="ghost" id="btnAddStu" type="button" style="padding:10px">＋ 加入</button>
    </div>
    <div class="hint" id="jf_rosterHint"></div>
  </div>
  <div class="bar"><div class="bar-inner"><button class="primary" id="btnJournal" type="button">送出日誌</button></div></div>
</main>

<!-- ============ 課堂學員：清單（沒指定課堂時） ============ -->
<main id="viewRosterList" class="hidden">
  <div class="hint" style="margin:0 4px 10px">點一堂課，查看這堂的學員與最近紀錄。</div>
  <div id="rl_list"></div>
</main>

<!-- ============ 課堂學員 ============ -->
<main id="viewRoster" class="hidden">
  <div class="session-head">
    <div class="t" id="r_title"></div>
    <div class="s" id="r_sub"></div>
  </div>
  <div id="r_prev"></div>
  <div class="section-title" id="r_count">學員</div>
  <div id="r_students"></div>
  <div class="bar hidden" id="r_bar"><div class="bar-inner"><button class="primary" id="btnRosterJournal" type="button"></button></div></div>
</main>

<!-- ============ 不可排日期 ============ -->
<main id="viewUnavail" class="hidden">
  <div class="card">
    <h2>新增不可排日期</h2>
    <div class="row2">
      <div class="field" data-field="開始">
        <label class="title" for="u_start">開始日期<span class="req">*</span></label>
        <input type="date" id="u_start">
      </div>
      <div class="field" data-field="結束">
        <label class="title" for="u_end">結束日期</label>
        <input type="date" id="u_end">
      </div>
    </div>
    <div class="error-text" id="u_error" style="margin:-6px 0 10px"></div>
    <div class="field">
      <label class="title" for="u_reason">原因</label>
      <input type="text" id="u_reason" maxlength="200" placeholder="例：出國、比賽">
    </div>
    <button class="primary" id="btnUnavail" type="button">新增</button>
  </div>
  <div class="section-title">已登記（今天以後）</div>
  <div id="u_list"></div>
</main>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ================================================================
// 設定：建置手冊第 09 節
// ================================================================
const LIFF_ID = '請填入教練 LIFF ID';          // 例：2001234567-AbCdEfGh
const GAS_URL = '請填入 GAS 網頁應用程式網址';  // https://script.google.com/macros/s/…/exec
const SHOW_ERROR_CODE = true;                    // 測試期間顯示錯誤代碼；上線後改為 false

// ================================================================
// 共用
// ================================================================
const $ = (id) => document.getElementById(id);
const VIEWS = ['viewLoading', 'viewError', 'viewDone', 'viewProfile', 'viewJournalList', 'viewJournalForm', 'viewRosterList', 'viewRoster', 'viewUnavail'];
const app = { idToken: '', page: 'profile', backTo: null };

function show(view, title) {
  VIEWS.forEach((v) => $(v).classList.toggle('hidden', v !== view));
  if (title) { $('pageTitle').textContent = title; document.title = title + '｜理論上匹克球'; }
  window.scrollTo(0, 0);
}
function setBack(fn) {
  app.backTo = fn;
  $('btnBack').classList.toggle('hidden', !fn);
}
function showError(message, code) {
  setBack(null);
  $('errorMsg').textContent = message || '請關閉頁面後再試一次。';
  $('errorCode').textContent = SHOW_ERROR_CODE && code ? '錯誤代碼：' + code : '';
  show('viewError', '無法開啟');
}
function showDone(title, msg, next) {
  setBack(null);
  $('doneTitle').textContent = title;
  $('doneMsg').textContent = msg;
  const b = $('btnDoneNext');
  b.classList.toggle('hidden', !next);
  if (next) { b.textContent = next.label; b.onclick = next.fn; }
  show('viewDone', title);
}
function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}
function el(tag, attrs, children) {
  const n = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (k === 'text') n.textContent = v;
    else if (k === 'onclick') n.addEventListener('click', v);
    else n.setAttribute(k, v);
  });
  (children || []).forEach((c) => c && n.appendChild(c));
  return n;
}
function renderChips(container, name, items, selected, type) {
  container.innerHTML = '';
  const set = new Set((selected || []).map(String));
  items.forEach((it) => {
    const value = typeof it === 'object' ? it.id : String(it);
    const label = typeof it === 'object' ? it.name : String(it);
    const input = el('input', { type: type || 'checkbox', name: name, value: value });
    input.checked = set.has(value);
    // 單選也允許再點一次取消
    if (type === 'radio') input.addEventListener('click', () => {
      if (input.dataset.was === '1') { input.checked = false; input.dataset.was = ''; }
      else { container.querySelectorAll('input').forEach((x) => (x.dataset.was = '')); input.dataset.was = '1'; }
    });
    if (input.checked) input.dataset.was = '1';
    container.appendChild(el('label', { class: 'chip' }, [input, el('span', { text: label })]));
  });
}
function checked(container) {
  return Array.from(container.querySelectorAll('input:checked')).map((i) => i.value);
}
function markInvalid(field, bad) {
  const box = document.querySelector('[data-field="' + field + '"]');
  if (box) box.classList.toggle('invalid', bad);
  return box;
}
function normalizePhone(v) {
  let s = String(v || '').replace(/\D/g, '');
  if (s.length === 9 && s.charAt(0) === '9') s = '0' + s;
  return s;
}

/** 呼叫 GAS：不設定 Content-Type（text/plain），避免 CORS 預檢 */
async function callGas(payload, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 20000);
  try {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(Object.assign({ idToken: app.idToken }, payload)), signal: ctrl.signal });
    const text = await res.text();
    try { return JSON.parse(text); } catch (e) { throw new Error('NON_JSON'); }
  } finally {
    clearTimeout(timer);
  }
}

/** 讀取用：失敗就顯示錯誤頁 */
async function load(payload) {
  show('viewLoading');
  let r;
  try {
    r = await callGas(payload);
  } catch (e) {
    showError('連線逾時，請稍後再試。', e.name === 'AbortError' ? 'TIMEOUT' : e.message);
    return null;
  }
  if (!r.ok) { showError(r.message || '載入失敗，請稍後再試。', r.error); return null; }
  return r;
}

/**
 * 寫入用：同一個 submissionId 最多送兩次（GAS 不會重複寫入）
 * 回傳 { ok, data } 或 { ok:false, message, uncertain }
 */
async function send(button, payload) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = '送出中…';
  let last = '';
  try {
    for (let i = 0; i < 2; i++) {
      try {
        const r = await callGas(payload, 20000);
        if (r.ok) return { ok: true, data: r };
        if (r.error !== 'BUSY') return { ok: false, message: (r.message || '送出失敗') + (SHOW_ERROR_CODE ? '（' + r.error + '）' : '') };
        last = 'BUSY';
      } catch (e) {
        last = e.name === 'AbortError' ? 'TIMEOUT' : e.message;
      }
    }
    return { ok: false, uncertain: true, message: '連線不穩定，資料可能已經送出。請稍後重新開啟確認；沒有更新的話再送一次即可（不會重複）。' + (SHOW_ERROR_CODE ? '（' + last + '）' : '') };
  } finally {
    button.disabled = false;
    button.textContent = label;
  }
}

function addStudentCard(data) {
  const r = journal.roster.find((x) => x.id === data.學員) || { name: '（不在名單中）', level: '' };
  const key = newId();
  const entry = { key: key, 紀錄ID: data.紀錄ID || '', 學員: data.學員 };
  journal.students.push(entry);
  const opts = journal.options;
  const mastery = el('div', { class: 'chips grid5' });
  renderChips(mastery, 'm_' + key, opts.mastery || [], data.掌握程度 ? [String(data.掌握程度)] : [], 'radio');
  const advice = el('div', { class: 'chips grid3' });
  renderChips(advice, 'a_' + key, opts.levelAdvice || [], data.程度建議 ? [data.程度建議] : [], 'radio');
  const ta = (ph, v) => { const t = el('textarea', { maxlength: '1000', placeholder: ph }); t.value = v || ''; t.style.minHeight = '56px'; return t; };
  const problem = ta('例：準備姿勢太晚', data.主要問題);
  const fix = ta('例：回位後先分腿墊步', data.需要修正);
  const note = ta('', data.備註);
  const card = el('div', { class: 'stu' }, [
    el('div', { class: 'stu-head' }, [
      el('b', { text: r.name + (r.level ? '（' + r.level + '）' : '') }),
      el('button', { class: 'link', type: 'button', text: '移除', onclick: () => {
        journal.students = journal.students.filter((x) => x.key !== key);
        card.remove();
        refreshPicker();
      } }),
    ]),
    field('主要問題', problem), field('需要修正', fix),
    field('掌握程度（1＝還不會，5＝很熟練）', mastery), field('程度建議', advice), field('備註', note),
  ]);
  entry.card = card;
  entry.read = () => ({
    紀錄ID: entry.紀錄ID, 學員: entry.學員,
    主要問題: problem.value.trim(), 需要修正: fix.value.trim(), 備註: note.value.trim(),
    掌握程度: checked(mastery)[0] || '', 程度建議: checked(advice)[0] || '',
  });
  $('jf_students').appendChild(card);
}

function studentCard(st, noteCount, onWrite) {
  const pills = [];
  if (st.makeup) pills.push(el('span', { class: 'pill', text: '補課生' }));
  if (ATTEND_TAG[st.thisStatus]) pills.push(el('span', { class: 'pill grey', text: ATTEND_TAG[st.thisStatus] }));
  if (st.advice) pills.push(el('span', { class: 'pill warn', text: st.advice }));
  if (!st.notes.length) pills.push(el('span', { class: 'pill grey', text: '尚無個別紀錄' }));

  const a = st.stats;
  const body = [el('div', { class: 'sc-att', text: '本班出缺勤：出席 ' + a.出席 + '・請假 ' + a.請假 + '・缺席 ' + a.缺席 })];
  st.notes.forEach((n) => {
    const meta = [n.dateText, n.coach, n.sameClass ? '' : n.className].filter(Boolean).join('・');
    const lines = [el('div', { class: 'm', text: meta })];
    const add = (k, v) => { if (v) lines.push(el('div', { class: 'l' }, [el('b', { text: k + '　' }), document.createTextNode(v)])); };
    add('問題', n.主要問題);
    add('修正', n.需要修正);
    add('掌握', n.掌握程度 ? n.掌握程度 + ' / 5' : '');
    add('建議', n.程度建議);
    add('備註', n.備註);
    body.push(el('div', { class: 'note' }, lines));
  });
  if (st.noteTotal > st.notes.length) {
    body.push(el('div', { class: 'hint', text: '只顯示最近 ' + noteCount + ' 筆，共 ' + st.noteTotal + ' 筆' }));
  }
  if (onWrite) {
    body.push(el('div', { class: 'sc-actions' }, [
      el('button', { class: 'ghost', type: 'button', text: '為這位學員寫紀錄', onclick: onWrite }),
    ]));
  }

  return el('details', { class: 'sc' }, [
    el('summary', {}, [
      el('div', { class: 'sc-top' }, [
        el('span', { class: 'sc-name' }, [document.createTextNode(st.name), st.level ? el('span', { class: 'sc-level', text: st.level }) : null]),
        el('span', { class: 'sc-arrow', text: '›' }),
      ]),
      pills.length ? el('div', { class: 'pills' }, pills) : null,
    ]),
    el('div', { class: 'sc-body' }, body),
  ]);
}

function renderUnavail(items) {
  const list = $('u_list');
  list.innerHTML = '';
  if (!items.length) list.appendChild(el('div', { class: 'empty', text: '目前沒有登記' }));
  items.forEach((it) => {
    const range = it.start === it.end ? fmtDay(it.start) : fmtDay(it.start) + ' ～ ' + fmtDay(it.end);
    const del = el('button', { class: 'link', type: 'button', text: '刪除' });
    del.addEventListener('click', async () => {
      if (!confirmInline(del)) return;
      del.disabled = true;
      try {
        const r = await callGas({ action: 'unavailDelete', id: it.id });
        if (!r.ok) { alertBox(r.message || '刪除失敗'); del.disabled = false; return; }
      } catch (e) { alertBox('連線不穩定，請稍後再試'); del.disabled = false; return; }
      openUnavail();
    });
    list.appendChild(el('div', { class: 'item' }, [
      el('div', { class: 'top' }, [el('span', { text: range }), del]),
      el('div', { class: 'sub', text: it.reason || '（未填原因）' }),
    ]));
  });
}

/** 第一次點「刪除」變成「確定刪除？」，再點一次才刪（避免使用會卡住 LINE 的 confirm 對話框） */
function confirmInline(btn) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1';
  btn.textContent = '確定刪除？';
  setTimeout(() => { btn.dataset.armed = ''; btn.textContent = '刪除'; }, 4000);
  return false;
}

function alertBox(msg) {
  const e = $('u_error');
  e.textContent = msg;
  e.style.display = 'block';
}

function fmtDay(key) {
  const [y, m, d] = key.split('-').map(Number);
  const w = '日一二三四五六'.charAt(new Date(y, m - 1, d).getDay());
  return m + '/' + d + '（' + w + '）';
}

$('btnUnavail').addEventListener('click', async () => {
  const start = $('u_start').value;
  const end = $('u_end').value || start;
  const e = $('u_error');
  e.style.display = 'none';
  if (!start) return alertBox('請選擇開始日期');
  if (start < unavail.today) return alertBox('不能登記今天以前的日期');
  if (end < start) return alertBox('結束日期不能早於開始日期');
  const r = await send($('btnUnavail'), {
    action: 'unavailSave', submissionId: unavail.submissionId, start: start, end: end, reason: $('u_reason').value.trim(),
  });
  if (!r.ok) return alertBox(r.message);
  unavail.submissionId = newId();
  $('u_end').value = '';
  $('u_reason').value = '';
  openUnavail();
});

/**
 * 讀取網址參數（page、session）。
 * LINE 開啟 https://liff.line.me/{LIFF ID}?page=journal 時，參數可能出現在兩個地方：
 *   1. 第一次載入：包在 liff.state 裡（?liff.state=%3Fpage%3Djournal）
 *   2. liff.init() 轉址後：直接在網址上（?page=journal）
 * 兩個都讀，避免一律落到預設頁。
 */
function readParams() {
  const out = {};
  const merge = (search) => {
    const p = new URLSearchParams(search);
    p.forEach((v, k) => { if (k !== 'liff.state' && !(k in out)) out[k] = v; });
    const state = p.get('liff.state');
    if (state) {
      const i = state.indexOf('?');
      new URLSearchParams(i >= 0 ? state.slice(i + 1) : state).forEach((v, k) => { if (!(k in out)) out[k] = v; });
    }
  };
  merge(location.search);
  return out;
}
const START_PARAMS = readParams(); // liff.init() 之前先讀一次

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
  } catch (e) {
    return showError('無法連接 LINE，請從官方帳號的選單開啟。', e.code || e.message);
  }
  if (!liff.isLoggedIn()) {
    liff.login({ redirectUri: location.href });
    return;
  }
  app.idToken = liff.getIDToken();
  if (!app.idToken) return showError('無法取得 LINE 身分，請關閉後重新開啟。', 'NO_ID_TOKEN');

  const params = Object.assign({}, START_PARAMS, readParams());
  app.page = params.page || 'profile';
  if (app.page === 'journal') {
    if (params.session) openJournalForm(params.session); else openJournalList();
  } else if (app.page === 'roster') {
    if (params.session) openRoster(params.session, openRosterList); else openRosterList();
  } else if (app.page === 'unavailable') {
    openUnavail();
  } else {
    openProfile();
  }
}
main();
</script>
